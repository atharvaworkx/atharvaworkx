<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 250" role="img" aria-labelledby="t d" xmlns:c2pa="http://c2pa.org/manifest"><metadata><c2pa:manifest></c2pa:manifest></metadata>
<title id="t">Working notes</title><desc id="d">Three animated glyphs: an API gate, an async hand-off, and an AI path with a deterministic floor.</desc>


<rect x="0" y="0" width="320" height="250" rx="14" fill="#0D0F14" stroke="#262C3B"/>
<text x="24" y="44" fill="#EDEAE0" font-family="'Segoe UI', -apple-system, 'Helvetica Neue', Arial, sans-serif" font-size="20" font-weight="700" text-anchor="start" >Reliable APIs</text>
<text x="24" y="72" fill="#8D96A8" font-family="'Segoe UI', -apple-system, 'Helvetica Neue', Arial, sans-serif" font-size="13" font-weight="400" text-anchor="start" >Explicit boundaries, safe failure modes, and</text>
<text x="24" y="91" fill="#8D96A8" font-family="'Segoe UI', -apple-system, 'Helvetica Neue', Arial, sans-serif" font-size="13" font-weight="400" text-anchor="start" >integrations that never become the least</text>
<text x="24" y="110" fill="#8D96A8" font-family="'Segoe UI', -apple-system, 'Helvetica Neue', Arial, sans-serif" font-size="13" font-weight="400" text-anchor="start" >observable part of a system.</text>
<rect x="340" y="0" width="320" height="250" rx="14" fill="#0D0F14" stroke="#262C3B"/>
<text x="364" y="44" fill="#EDEAE0" font-family="'Segoe UI', -apple-system, 'Helvetica Neue', Arial, sans-serif" font-size="20" font-weight="700" text-anchor="start" >Asynchronous by design</text>
<text x="364" y="72" fill="#8D96A8" font-family="'Segoe UI', -apple-system, 'Helvetica Neue', Arial, sans-serif" font-size="13" font-weight="400" text-anchor="start" >Expensive work leaves the request path.</text>
<text x="364" y="91" fill="#8D96A8" font-family="'Segoe UI', -apple-system, 'Helvetica Neue', Arial, sans-serif" font-size="13" font-weight="400" text-anchor="start" >State is preserved and the hand-off</text>
<text x="364" y="110" fill="#8D96A8" font-family="'Segoe UI', -apple-system, 'Helvetica Neue', Arial, sans-serif" font-size="13" font-weight="400" text-anchor="start" >stays inspectable.</text>
<rect x="680" y="0" width="320" height="250" rx="14" fill="#0D0F14" stroke="#262C3B"/>
<text x="704" y="44" fill="#EDEAE0" font-family="'Segoe UI', -apple-system, 'Helvetica Neue', Arial, sans-serif" font-size="20" font-weight="700" text-anchor="start" >AI with a floor</text>
<text x="704" y="72" fill="#8D96A8" font-family="'Segoe UI', -apple-system, 'Helvetica Neue', Arial, sans-serif" font-size="13" font-weight="400" text-anchor="start" >Models where they help, deterministic</text>
<text x="704" y="91" fill="#8D96A8" font-family="'Segoe UI', -apple-system, 'Helvetica Neue', Arial, sans-serif" font-size="13" font-weight="400" text-anchor="start" >behavior for offline, constrained, or</text>
<text x="704" y="110" fill="#8D96A8" font-family="'Segoe UI', -apple-system, 'Helvetica Neue', Arial, sans-serif" font-size="13" font-weight="400" text-anchor="start" >reproducibility-sensitive paths.</text>
<g><path d="M24 188H296" stroke="#262C3B"/><path d="M170 148V176M170 200V228" stroke="#EDEAE0" stroke-width="3" stroke-linecap="round"/><circle r="5" cy="188" fill="#7CE3A1"><animate attributeName="cx" values="24;24;296;296" keyTimes="0;0.05;0.45;1" dur="6s" repeatCount="indefinite"/><animate attributeName="opacity" values="0;1;1;0;0" keyTimes="0;0.05;0.43;0.46;1" dur="6s" repeatCount="indefinite" /></circle><circle r="5" cy="188" fill="#FF4D5E"><animate attributeName="cx" values="24;24;150;24;24" keyTimes="0;0.5;0.68;0.88;1" dur="6s" repeatCount="indefinite"/><animate attributeName="opacity" values="0;0;1;1;0;0" keyTimes="0;0.49;0.5;0.86;0.9;1" dur="6s" repeatCount="indefinite" /></circle><text x="296" y="222" fill="#7CE3A1" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, 'Liberation Mono', monospace" font-size="11" font-weight="400" text-anchor="end" >200</text><text x="40" y="222" fill="#FF4D5E" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, 'Liberation Mono', monospace" font-size="11" font-weight="400" text-anchor="start" >4xx</text></g>
<path d="M364 168H636" stroke="#262C3B"/><rect x="364" y="200" width="272" height="10" rx="5" fill="#262C3B"/><rect x="364" y="200" width="0" height="10" rx="5" fill="#4FD8E3"><animate attributeName="width" values="0;0;272;272" keyTimes="0;0.1;0.85;1" dur="6s" repeatCount="indefinite" /></rect><circle r="5" cy="168" fill="#FFC145"><animate attributeName="cx" values="364;364;636;636" keyTimes="0;0.05;0.2;1" dur="6s" repeatCount="indefinite"/><animate attributeName="opacity" values="0;1;1;0;0" keyTimes="0;0.05;0.19;0.22;1" dur="6s" repeatCount="indefinite" /></circle><text x="364" y="152" fill="#8D96A8" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, 'Liberation Mono', monospace" font-size="11" font-weight="400" text-anchor="start" >request: 200 immediately</text><text x="364" y="230" fill="#8D96A8" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, 'Liberation Mono', monospace" font-size="11" font-weight="400" text-anchor="start" >worker: still going, state preserved</text>
<path d="M704 172 C730 140 750 204 776 172 S820 140 846 172" fill="none" stroke="#B69CFF" stroke-dasharray="4 4" stroke-width="2"/><path d="M846 172 L870 214" fill="none" stroke="#FF4D5E" stroke-dasharray="2 3"/><path d="M704 214H976" stroke="#7CE3A1" stroke-width="2" stroke-opacity=".5"/><circle r="5" fill="#EDEAE0"><animateMotion dur="6s" repeatCount="indefinite" calcMode="linear" keyPoints="0;0;1;1" keyTimes="0;0.08;0.9;1" path="M704 172 C730 140 750 204 776 172 S820 140 846 172 L870 214 L976 214"/></circle><text x="976" y="234" fill="#8D96A8" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, 'Liberation Mono', monospace" font-size="11" font-weight="400" text-anchor="end" >deterministic floor</text><text x="704" y="152" fill="#B69CFF" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, 'Liberation Mono', monospace" font-size="11" font-weight="400" text-anchor="start" >model</text>
</svg>