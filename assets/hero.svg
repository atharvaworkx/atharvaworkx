<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 320" fill="none">
  <defs>
    <radialGradient id="glow1" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#38BDF8" stop-opacity="0.3"/>
      <stop offset="100%" stop-color="#38BDF8" stop-opacity="0"/>
    </radialGradient>
    <radialGradient id="glow2" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#8B5CF6" stop-opacity="0.25"/>
      <stop offset="100%" stop-color="#8B5CF6" stop-opacity="0"/>
    </radialGradient>
    <filter id="softGlow">
      <feGaussianBlur stdDeviation="2" result="blur"/>
      <feMerge><feMergeNode in="blur"/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
  </defs>

  <!-- Background grid -->
  <pattern id="grid" width="30" height="30" patternUnits="userSpaceOnUse">
    <path d="M 30 0 L 0 0 0 30" fill="none" stroke="#1E293B" stroke-width="0.5" opacity="0.4"/>
  </pattern>
  <rect width="900" height="320" fill="#090B10"/>
  <rect width="900" height="320" fill="url(#grid)"/>

  <!-- Subtle scan line -->
  <rect width="900" height="2" fill="#38BDF8" opacity="0.06">
    <animate attributeName="y" from="-2" to="320" dur="8s" repeatCount="indefinite"/>
  </rect>

  <!-- Connection lines -->
  <!-- CLIENT to GATEWAY -->
  <line x1="450" y1="55" x2="450" y2="95" stroke="#263244" stroke-width="1.5"/>
  <line x1="450" y1="55" x2="450" y2="95" stroke="#38BDF8" stroke-width="1.5" stroke-dasharray="4,8" opacity="0.5">
    <animate attributeName="stroke-dashoffset" from="12" to="0" dur="2s" repeatCount="indefinite"/>
  </line>

  <!-- GATEWAY to EVENT BUS -->
  <line x1="450" y1="120" x2="450" y2="160" stroke="#263244" stroke-width="1.5"/>
  <line x1="450" y1="120" x2="450" y2="160" stroke="#38BDF8" stroke-width="1.5" stroke-dasharray="4,8" opacity="0.5">
    <animate attributeName="stroke-dashoffset" from="12" to="0" dur="2s" repeatCount="indefinite"/>
  </line>

  <!-- EVENT BUS to workers -->
  <line x1="450" y1="185" x2="200" y2="240" stroke="#263244" stroke-width="1"/>
  <line x1="450" y1="185" x2="350" y2="240" stroke="#263244" stroke-width="1"/>
  <line x1="450" y1="185" x2="550" y2="240" stroke="#263244" stroke-width="1"/>
  <line x1="450" y1="185" x2="700" y2="240" stroke="#263244" stroke-width="1"/>

  <!-- Animated signal lines -->
  <line x1="450" y1="185" x2="200" y2="240" stroke="#8B5CF6" stroke-width="1" stroke-dasharray="3,9" opacity="0.4">
    <animate attributeName="stroke-dashoffset" from="12" to="0" dur="3s" repeatCount="indefinite"/>
  </line>
  <line x1="450" y1="185" x2="350" y2="240" stroke="#38BDF8" stroke-width="1" stroke-dasharray="3,9" opacity="0.4">
    <animate attributeName="stroke-dashoffset" from="12" to="0" dur="2.5s" repeatCount="indefinite"/>
  </line>
  <line x1="450" y1="185" x2="550" y2="240" stroke="#38BDF8" stroke-width="1" stroke-dasharray="3,9" opacity="0.4">
    <animate attributeName="stroke-dashoffset" from="12" to="0" dur="3.5s" repeatCount="indefinite"/>
  </line>
  <line x1="450" y1="185" x2="700" y2="240" stroke="#8B5CF6" stroke-width="1" stroke-dasharray="3,9" opacity="0.4">
    <animate attributeName="stroke-dashoffset" from="12" to="0" dur="2.8s" repeatCount="indefinite"/>
  </line>

  <!-- Moving particles along paths -->
  <!-- Client -> Gateway particle -->
  <circle r="3" fill="#38BDF8" filter="url(#softGlow)" opacity="0.9">
    <animateMotion dur="2s" repeatCount="indefinite" path="M450,55 L450,95"/>
  </circle>

  <!-- Gateway -> EventBus particle -->
  <circle r="3" fill="#38BDF8" filter="url(#softGlow)" opacity="0.9">
    <animateMotion dur="2s" repeatCount="indefinite" path="M450,120 L450,160"/>
  </circle>

  <!-- EventBus -> Worker particles -->
  <circle r="2.5" fill="#38BDF8" filter="url(#softGlow)" opacity="0.8">
    <animateMotion dur="3s" repeatCount="indefinite" path="M450,185 L200,240"/>
  </circle>
  <circle r="2.5" fill="#38BDF8" filter="url(#softGlow)" opacity="0.8">
    <animateMotion dur="2.5s" repeatCount="indefinite" path="M450,185 L350,240"/>
  </circle>
  <circle r="2.5" fill="#8B5CF6" filter="url(#softGlow)" opacity="0.8">
    <animateMotion dur="3.5s" repeatCount="indefinite" path="M450,185 L550,240"/>
  </circle>
  <circle r="2.5" fill="#8B5CF6" filter="url(#softGlow)" opacity="0.8">
    <animateMotion dur="2.8s" repeatCount="indefinite" path="M450,185 L700,240"/>
  </circle>

  <!-- Glow effects at nodes -->
  <circle cx="450" cy="45" r="30" fill="url(#glow1)"/>
  <circle cx="450" cy="110" r="35" fill="url(#glow1)"/>
  <circle cx="450" cy="175" r="40" fill="url(#glow2)"/>

  <!-- Nodes -->
  <!-- CLIENT -->
  <rect x="405" y="30" width="90" height="30" rx="4" fill="#0F172A" stroke="#38BDF8" stroke-width="1"/>
  <text x="450" y="50" font-family="monospace" font-size="10" fill="#38BDF8" text-anchor="middle" font-weight="600">CLIENT</text>

  <!-- API GATEWAY -->
  <rect x="385" y="95" width="130" height="30" rx="4" fill="#0F172A" stroke="#38BDF8" stroke-width="1"/>
  <text x="450" y="115" font-family="monospace" font-size="9" fill="#38BDF8" text-anchor="middle" font-weight="600">API GATEWAY</text>

  <!-- EVENT BUS -->
  <rect x="390" y="160" width="120" height="30" rx="4" fill="#0F172A" stroke="#8B5CF6" stroke-width="1"/>
  <text x="450" y="180" font-family="monospace" font-size="9" fill="#8B5CF6" text-anchor="middle" font-weight="600">EVENT BUS</text>

  <!-- Worker nodes -->
  <rect x="150" y="230" width="100" height="30" rx="4" fill="#0F172A" stroke="#1E293B" stroke-width="1"/>
  <text x="200" y="250" font-family="monospace" font-size="8" fill="#94A3B8" text-anchor="middle">WORKER</text>

  <rect x="300" y="230" width="100" height="30" rx="4" fill="#0F172A" stroke="#1E293B" stroke-width="1"/>
  <text x="350" y="250" font-family="monospace" font-size="8" fill="#94A3B8" text-anchor="middle">AI AGENT</text>

  <rect x="500" y="230" width="100" height="30" rx="4" fill="#0F172A" stroke="#1E293B" stroke-width="1"/>
  <text x="550" y="250" font-family="monospace" font-size="8" fill="#94A3B8" text-anchor="middle">PIPELINE</text>

  <rect x="650" y="230" width="100" height="30" rx="4" fill="#0F172A" stroke="#1E293B" stroke-width="1"/>
  <text x="700" y="250" font-family="monospace" font-size="8" fill="#94A3B8" text-anchor="middle">DATABASE</text>

  <!-- Node status dots -->
  <circle cx="200" cy="228" r="3" fill="#38BDF8" opacity="0.8">
    <animate attributeName="opacity" values="0.8;0.3;0.8" dur="3s" repeatCount="indefinite"/>
  </circle>
  <circle cx="350" cy="228" r="3" fill="#8B5CF6" opacity="0.8">
    <animate attributeName="opacity" values="0.8;0.3;0.8" dur="2.5s" repeatCount="indefinite"/>
  </circle>
  <circle cx="550" cy="228" r="3" fill="#38BDF8" opacity="0.8">
    <animate attributeName="opacity" values="0.8;0.3;0.8" dur="3.5s" repeatCount="indefinite"/>
  </circle>
  <circle cx="700" cy="228" r="3" fill="#8B5CF6" opacity="0.8">
    <animate attributeName="opacity" values="0.8;0.3;0.8" dur="2.8s" repeatCount="indefinite"/>
  </circle>

  <!-- System status indicator -->
  <circle cx="810" cy="25" r="4" fill="#38BDF8" opacity="0.7">
    <animate attributeName="opacity" values="0.7;0.2;0.7" dur="3s" repeatCount="indefinite"/>
  </circle>
  <text x="820" y="29" font-family="monospace" font-size="8" fill="#94A3B8" opacity="0.6">SYSTEM ONLINE</text>

  <!-- Bottom labels -->
  <text x="200" y="280" font-family="monospace" font-size="7" fill="#475569" text-anchor="middle">async</text>
  <text x="350" y="280" font-family="monospace" font-size="7" fill="#475569" text-anchor="middle">inference</text>
  <text x="550" y="280" font-family="monospace" font-size="7" fill="#475569" text-anchor="middle">streaming</text>
  <text x="700" y="280" font-family="monospace" font-size="7" fill="#475569" text-anchor="middle">persisted</text>
</svg>