      <animate attributeName="y1" from="20" to="360" dur="8s" repeatCount="indefinite"/>
      <animate attributeName="y2" from="20" to="360" dur="8s" repeatCount="indefinite"/>
      <animate attributeName="opacity" values="0;0.4;0.4;0" keyTimes="0;0.08;0.92;1" dur="8s" repeatCount="indefinite"/>
    </line>
    <rect x="60" y="-12" width="680" height="24" rx="12" fill="#38BDF8" opacity="0">
