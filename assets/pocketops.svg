<rect x="860" y="46" width="100" height="34" rx="6" fill="#141823" stroke="#262C3B"/><text x="910.0" y="67" fill="#EDEAE0" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, 'Liberation Mono', monospace" font-size="12" font-weight="400" text-anchor="middle" >500 response</text>
