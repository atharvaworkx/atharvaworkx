<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 310" role="img" aria-labelledby="t d" xmlns:c2pa="http://c2pa.org/manifest"><metadata><c2pa:manifest></c2pa:manifest></metadata>
<title id="t">PocketOps</title><desc id="d">Animated diagram: the request path returns immediately while a diagnostic event is delivered asynchronously with dangerous fields excluded.</desc>
<rect width="1000" height="310" rx="14" fill="#0D0F14"/>
<rect x=".5" y=".5" width="999" height="309" rx="14" fill="none" stroke="#262C3B"/>
<text x="40" y="74" fill="#EDEAE0" font-family="'Segoe UI', -apple-system, 'Helvetica Neue', Arial, sans-serif" font-size="34" font-weight="700" text-anchor="start" letter-spacing="-.6">PocketOps</text>
<text x="40" y="110" fill="#8D96A8" font-family="'Segoe UI', -apple-system, 'Helvetica Neue', Arial, sans-serif" font-size="15" font-weight="400" text-anchor="start" >A drop-in exception handler for Django and DRF</text>
<text x="40" y="132" fill="#8D96A8" font-family="'Segoe UI', -apple-system, 'Helvetica Neue', Arial, sans-serif" font-size="15" font-weight="400" text-anchor="start" >that classifies failures and reports them</text>
<text x="40" y="154" fill="#8D96A8" font-family="'Segoe UI', -apple-system, 'Helvetica Neue', Arial, sans-serif" font-size="15" font-weight="400" text-anchor="start" >asynchronously, without leaking what broke.</text>
<rect x="40" y="198" width="3" height="42" fill="#4FD8E3"/>
<text x="54" y="212" fill="#D8DBE4" font-family="'Segoe UI', -apple-system, 'Helvetica Neue', Arial, sans-serif" font-size="13.5" font-weight="400" text-anchor="start" >Delivery stays off the request path, and the event</text>
<text x="54" y="232" fill="#D8DBE4" font-family="'Segoe UI', -apple-system, 'Helvetica Neue', Arial, sans-serif" font-size="13.5" font-weight="400" text-anchor="start" >schema keeps debugging useful without becoming a leak.</text>
<text x="40" y="286" fill="#8D96A8" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, 'Liberation Mono', monospace" font-size="12" font-weight="400" text-anchor="start" >Django · DRF · PostgreSQL · httpx · Flutter</text>
<rect x="470" y="46" width="100" height="34" rx="6" fill="#141823" stroke="#262C3B"/><text x="520.0" y="67" fill="#EDEAE0" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, 'Liberation Mono', monospace" font-size="12" font-weight="400" text-anchor="middle" >view raises</text>
