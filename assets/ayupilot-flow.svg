<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 500 200">
  <defs>
    <pattern id="grid" width="20" height="20" patternUnits="userSpaceOnUse">
      <path d="M 20 0 L 0 0 0 20" fill="none" stroke="#1E293B" stroke-width="0.5"/>
    </pattern>
    <filter id="glow">
      <feGaussianBlur stdDeviation="2" result="blur"/>
      <feMerge>
        <feMergeNode in="blur"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>
    <linearGradient id="particleGrad" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#38BDF8"/>
      <stop offset="100%" stop-color="#8B5CF6"/>
    </linearGradient>
    <style>
      @keyframes pulse { 0%,100% { opacity: 0.6; } 50% { opacity: 1; } }
      @keyframes dash { to { stroke-dashoffset: -16; } }
      .node-rect { fill: #0F172A; stroke: #1E293B; stroke-width: 1.5; rx: 8; }
      .node-stroke { fill: none; stroke-width: 1; rx: 8; }
      .label { fill: #94A3B8; font-family: 'Segoe UI',system-ui,sans-serif; font-size: 10px; text-anchor: middle; letter-spacing: 0.5px; }
      .dashed { stroke: #1E293B; stroke-width: 1; stroke-dasharray: 4 4; animation: dash 0.8s linear infinite; }
      .status-dot { animation: pulse 2s ease-in-out infinite; }
      .particle { filter: url(#glow); }
    </style>
  </defs>

  <rect width="500" height="200" fill="#090B10"/>
  <rect width="500" height="200" fill="url(#grid)"/>

  <line x1="250" y1="32" x2="250" y2="47" class="dashed"/>
  <line x1="250" y1="67" x2="250" y2="82" class="dashed"/>
  <line x1="250" y1="102" x2="250" y2="117" class="dashed"/>
  <line x1="250" y1="137" x2="250" y2="152" class="dashed"/>

  <rect x="195" y="14" width="110" height="18" class="node-rect"/>
  <rect x="195" y="14" width="110" height="18" class="node-stroke" stroke="#38BDF8"/>
  <circle cx="205" cy="23" r="3" fill="#38BDF8" class="status-dot"/>
  <text x="260" y="26" class="label">IMAGE INPUT</text>

  <rect x="195" y="49" width="110" height="18" class="node-rect"/>
  <rect x="195" y="49" width="110" height="18" class="node-stroke" stroke="#38BDF8"/>
  <circle cx="205" cy="58" r="3" fill="#38BDF8" class="status-dot"/>
  <text x="260" y="61" class="label">PROCESSING</text>

  <rect x="195" y="84" width="110" height="18" class="node-rect"/>
  <rect x="195" y="84" width="110" height="18" class="node-stroke" stroke="#8B5CF6"/>
  <circle cx="205" cy="93" r="3" fill="#8B5CF6" class="status-dot"/>
  <text x="260" y="96" class="label">AI INFERENCE</text>

  <rect x="195" y="119" width="110" height="18" class="node-rect"/>
  <rect x="195" y="119" width="110" height="18" class="node-stroke" stroke="#8B5CF6"/>
  <circle cx="205" cy="128" r="3" fill="#8B5CF6" class="status-dot"/>
  <text x="260" y="131" class="label">REPORT</text>

  <rect x="195" y="154" width="110" height="18" class="node-rect"/>
  <rect x="195" y="154" width="110" height="18" class="node-stroke" stroke="#8B5CF6"/>
  <circle cx="205" cy="163" r="3" fill="#8B5CF6" class="status-dot"/>
  <text x="260" y="166" class="label">DATABASE</text>

  <circle r="4" fill="url(#particleGrad)" class="particle" opacity="0.9">
    <animateMotion dur="4s" repeatCount="indefinite" keyPoints="0;1" keyTimes="0;1" calcMode="linear">
      <mpath href="#particlePath"/>
    </animateMotion>
  </circle>

  <path id="particlePath" d="M 250 23 L 250 163" fill="none" stroke="none"/>
</svg>